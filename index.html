<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cable Box IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;user-select:none;outline:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Segoe UI',Tahoma,Verdana,sans-serif}
#video-container{position:absolute;inset:0;background:#000;z-index:1}
video{width:100%;height:100%;object-fit:contain}
#loader{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border:5px solid rgba(255,255,255,.2);border-top-color:#00d2ff;border-radius:50%;animation:spin .8s linear infinite;z-index:5;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(0,0,0,.75);padding:14px 22px;border-radius:8px;font-size:20px;display:none;text-align:center}
#channel-num-badge{position:absolute;top:30px;right:40px;font-size:52px;font-weight:800;color:#00ff66;text-shadow:2px 2px 8px #000;z-index:10;display:none}
#info-banner{position:absolute;bottom:30px;left:5%;width:90%;min-height:100px;background:linear-gradient(180deg,rgba(16,26,43,.95),rgba(5,10,18,.98));border-left:8px solid #00d2ff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.9);display:flex;align-items:center;padding:10px 25px;z-index:15;transition:transform .4s,opacity .4s;transform:translateY(150%);opacity:0;pointer-events:none}
#info-banner.show{transform:none;opacity:1}
.banner-logo{width:80px;height:70px;object-fit:contain;margin-right:25px;background:rgba(255,255,255,.1);border-radius:6px;padding:4px}
.banner-details{flex-grow:1;min-width:0}
.banner-top{display:flex;align-items:center;gap:15px;margin-bottom:5px}
.ch-number{background:#00d2ff;color:#000;font-weight:900;padding:2px 10px;border-radius:4px;font-size:20px}
.ch-name{font-size:26px;font-weight:700}
.banner-sub{font-size:16px;color:#a0aec0;display:flex;gap:20px;flex-wrap:wrap}
.banner-time{font-size:28px;font-weight:700;border-left:2px solid rgba(255,255,255,.2);padding-left:25px}
/* கட்டுப்பாட்டு பட்டன்கள் (மவுஸ்/டச்) */
#controls{position:absolute;top:20px;left:20px;z-index:18;display:flex;gap:10px;transition:opacity .4s}
#controls.hide{opacity:0;pointer-events:none}
#controls button{background:rgba(10,16,26,.85);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;min-width:46px;height:46px;padding:0 14px;font-size:18px;cursor:pointer}
#controls button:hover,#controls button:focus-visible{background:#00d2ff;color:#050b14}
#channel-list-menu{position:absolute;top:0;left:-400px;width:min(380px,90vw);height:100%;background:rgba(10,16,26,.96);backdrop-filter:blur(8px);z-index:20;transition:left .3s;box-shadow:10px 0 30px rgba(0,0,0,.8);display:flex;flex-direction:column}
#channel-list-menu.open{left:0}
.menu-header{padding:25px 20px;background:#00d2ff;color:#050b14;font-size:22px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.menu-header button{background:none;border:0;font-size:26px;cursor:pointer;color:#050b14}
.channel-items{flex-grow:1;overflow-y:auto;padding:10px 0}
.channel-item{display:flex;align-items:center;padding:14px 20px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.channel-item.selected,.channel-item:hover{background:linear-gradient(90deg,rgba(0,210,255,.4),rgba(0,210,255,.05));border-left:5px solid #00d2ff}
.channel-item.playing{color:#00ff66}
.item-num{width:45px;font-weight:700;font-size:18px;color:#718096}
.channel-item.selected .item-num{color:#fff}
.item-name{font-size:18px;font-weight:500}
#start{position:absolute;inset:0;z-index:30;background:#050b14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer}
#start h1{font-size:34px}
#start .play{width:96px;height:96px;border-radius:50%;background:#00d2ff;color:#050b14;display:flex;align-items:center;justify-content:center;font-size:44px;padding-left:8px}
#start p{color:#a0aec0}
@media(max-width:640px){#info-banner{width:96%;left:2%;padding:8px 14px}.banner-logo{width:56px;height:50px;margin-right:12px}.ch-name{font-size:20px}.banner-time{font-size:18px;padding-left:12px}#channel-num-badge{font-size:34px;right:16px}}
</style>
</head>
<body>
<div id="video-container"><video id="tv-video" playsinline></video><div id="loader"></div><div id="msg"></div></div>
<div id="channel-num-badge">CH 001</div>

<div id="controls">
  <button id="btn-menu" title="சேனல் பட்டியல் (Enter)">☰</button>
  <button id="btn-prev" title="முந்தைய சேனல் (↑)">▲</button>
  <button id="btn-next" title="அடுத்த சேனல் (↓)">▼</button>
  <button id="btn-mute" title="ஒலி (M)">🔊</button>
  <button id="btn-fs" title="முழுத்திரை (F)">⛶</button>
</div>

<div id="info-banner">
  <img id="b-logo" class="banner-logo" alt="">
  <div class="banner-details">
    <div class="banner-top"><span id="b-num" class="ch-number">CH 1</span><span id="b-name" class="ch-name"></span></div>
    <div class="banner-sub"><span id="b-group"></span><span>• Live Digital Broadcast</span></div>
  </div>
  <div id="b-time" class="banner-time"></div>
</div>

<div id="channel-list-menu">
  <div class="menu-header"><span>சேனல் பட்டியல்</span><button id="btn-close" aria-label="மூடு">✕</button></div>
  <div id="channel-items" class="channel-items"></div>
</div>

<div id="start">
  <h1>Cable Box IPTV</h1>
  <div class="play">▶</div>
  <p>பார்க்கத் தொடங்க கிளிக் / தட்டவும் அல்லது Enter அழுத்தவும்</p>
</div>

<script>
const channels = [
 {id:1,name:"Sana TV",group:"Tamil Local",logo:"https://raw.githubusercontent.com/amazeyourself/tamil-local-iptv/main/logos/SanaTV.svg",url:"https://stream.ottlive.co.in/sanatv/index.m3u8?origin=github.com/amazeyourself"},
 {id:2,name:"Sana Plus",group:"Music",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/sanaplus.png",url:"https://stream.ottlive.co.in/sanaplus/index.m3u8?origin=github.com/amazeyourself"},
 {id:3,name:"Ultimate TV HD",group:"Tamil Local",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/utvtamil.png",url:"https://stream.ottlive.co.in/utvtamil/index.m3u8?origin=github.com/amazeyourself"},
 {id:4,name:"Rock TV HD",group:"Tamil Local",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/suriyantvtamil.png",url:"https://stream.ottlive.co.in/suriyantvtamil/index.m3u8?origin=github.com/amazeyourself"},
 {id:5,name:"Roja TV",group:"Tamil Local",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/rojatv.png",url:"https://hls.rojatv.cloud/rojatv/rojatv/index.m3u8?origin=github.com/amazeyourself"},
 {id:6,name:"Roja Movies",group:"Movies",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/rojamovies.png",url:"https://hls.rojatv.cloud/rojamovies/rojamovies/index.m3u8?origin=github.com/amazeyourself"},
 {id:7,name:"Aaryaa TV",group:"Music",logo:"https://jiotvimages.cdn.jio.com/dare_images/images/aryatvtamil.png",url:"https://stream.ottlive.co.in/aryatvtamil/index.m3u8?origin=github.com/amazeyourself"},
 {id:8,name:"Dharsan TV (பக்தி)",group:"Hindu Devotional",logo:"https://livetv.ashokadigital.net/upload/logo/1791256883_WhatsApp%20Image%202026-10-06%20at%208.42.31%20AM.jpeg",url:"https://cable91tataplay.akamaized.net/live/dharshantv/index.m3u8?origin=github.com/amazeyourself"},
 {id:9,name:"Nijam TV (பக்தி)",group:"Christian Devotional",logo:"https://tamiltvchannels.com/img/devotional/Nijam%20TV.png",url:"https://nijamtv.nijamtv.org/live/nijamtv/index.m3u8?origin=github.com/amazeyourself"},
 {id:10,name:"Aalaya TV",group:"Hindu Devotional",logo:"https://api.nellaiiptv.com/public/uploads/channel/logos/1788356009.webp",url:"https://rtmp.applelive.in/aalayatv/aalayatv/index.m3u8?origin=github.com/amazeyourself"},
 {id:11,name:"Kumari TV",group:"Tamil Local",logo:"https://play-lh.googleusercontent.com/5BbVPm_jHSHPVY3XLhfYjpJJtXi1qVV3jlJ9i-cTE0gckC_LSEBKftLgU6uX_UMXgQ",url:"https://applelive.in/kumaritv/gvkumaritv/index.m3u8?origin=github.com/amazeyourself"},
 {id:12,name:"Time TV",group:"Tamil Local",logo:"https://raw.githubusercontent.com/amazeyourself/tamil-local-iptv/main/logos/TimeTV.svg",url:"https://live.olidigital.in/timetv/timetv/index.m3u8?origin=github.com/amazeyourself"},
 {id:13,name:"Sun Smart TV",group:"Tamil Local",logo:"https://raw.githubusercontent.com/amazeyourself/tamil-local-iptv/main/logos/SunSmartTV.png",url:"https://sunsmart.ipcloud.live/sunsmarttv/sunsmarttv/index.m3u8?origin=github.com/amazeyourself"}
];

const $ = id => document.getElementById(id);
const video=$('tv-video'), banner=$('info-banner'), badge=$('channel-num-badge'),
      sideMenu=$('channel-list-menu'), listBox=$('channel-items'), loader=$('loader'),
      msg=$('msg'), controls=$('controls'), startScr=$('start');
let cur=0, menuOpen=false, cursor=0, started=false;
let bannerT, numT, ctrlT, msgT, typed="", hls=null;
const pad = n => String(n).padStart(3,'0');

function buildList(){
  listBox.innerHTML='';
  channels.forEach((ch,i)=>{
    const el=document.createElement('div');
    el.className='channel-item'; el.id='ch-item-'+i;
    el.innerHTML=`<span class="item-num">${pad(ch.id)}</span><span class="item-name">${ch.name}</span>`;
    el.onclick=()=>{changeChannel(i);toggleMenu(false)};
    listBox.appendChild(el);
  });
}

function showMsg(t,ms){
  msg.textContent=t; msg.style.display='block'; clearTimeout(msgT);
  if(ms) msgT=setTimeout(()=>msg.style.display='none',ms);
}

function destroyHls(){ if(hls){hls.destroy();hls=null} }

function changeChannel(index){
  if(index<0) index=channels.length-1;
  if(index>=channels.length) index=0;
  cur=index; const ch=channels[cur];
  loader.style.display='block'; msg.style.display='none';
  destroyHls();
  video.removeAttribute('src');

  if(window.Hls && Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false});
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal) return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){ showMsg('நெட்வொர்க் பிழை – மீண்டும் முயற்சிக்கிறது…'); setTimeout(()=>hls&&hls.startLoad(),2000); }
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
      else { loader.style.display='none'; showMsg('இந்த சேனல் தற்போது இயங்கவில்லை',5000); }
    });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=ch.url; video.play().catch(()=>{});
  } else {
    loader.style.display='none'; showMsg('இந்த பிரவுசர் HLS-ஐ ஆதரிக்கவில்லை');
  }
  showBanner(); updateFocus();
}

video.addEventListener('playing',()=>{loader.style.display='none';msg.style.display='none'});
video.addEventListener('waiting',()=>{loader.style.display='block'});
video.addEventListener('canplay',()=>{loader.style.display='none'});
video.addEventListener('volumechange',()=>{$('btn-mute').textContent=(video.muted||video.volume===0)?'🔇':'🔊'});

function showBanner(){
  const ch=channels[cur];
  $('b-num').textContent='CH '+pad(ch.id);
  $('b-name').textContent=ch.name;
  $('b-group').textContent=ch.group;
  $('b-logo').src=ch.logo;
  $('b-time').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  banner.classList.add('show');
  badge.textContent='CH '+pad(ch.id); badge.style.display='block';
  clearTimeout(bannerT);
  bannerT=setTimeout(()=>{banner.classList.remove('show');badge.style.display='none'},4000);
}
$('b-logo').onerror=function(){this.onerror=null;this.src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 24 24' fill='%23fff'><path d='M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z'/></svg>"};

function toggleMenu(force){
  menuOpen = force!==undefined ? force : !menuOpen;
  if(menuOpen){cursor=cur;sideMenu.classList.add('open');updateFocus()}
  else sideMenu.classList.remove('open');
}
function updateFocus(){
  document.querySelectorAll('.channel-item').forEach((it,i)=>{
    it.classList.toggle('selected',i===cursor);
    it.classList.toggle('playing',i===cur);
  });
  const a=$('ch-item-'+cursor); if(a) a.scrollIntoView({block:'nearest'});
}

function numberInput(d){
  typed+=d; if(typed.length>3) typed=d;
  badge.textContent='CH '+typed+'_'; badge.style.display='block';
  clearTimeout(numT);
  numT=setTimeout(()=>{
    const i=channels.findIndex(c=>c.id===parseInt(typed,10));
    typed="";
    if(i!==-1) changeChannel(i); else {badge.style.display='none';showMsg('அந்த எண்ணில் சேனல் இல்லை',2000)}
  },1500);
}

function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
}
function toggleMute(){video.muted=!video.muted}

function wakeControls(){
  controls.classList.remove('hide'); clearTimeout(ctrlT);
  ctrlT=setTimeout(()=>{if(!menuOpen)controls.classList.add('hide')},3500);
}

function startPlayback(){
  if(started) return; started=true;
  startScr.style.display='none';
  changeChannel(0); wakeControls();
}

// விசைப்பலகை / ரிமோட்
window.addEventListener('keydown',e=>{
  if(!started){ if(e.key==='Enter'||e.key===' '){startPlayback();e.preventDefault()} return; }
  wakeControls();
  switch(e.key){
    case 'ArrowUp': case 'PageUp':
      if(menuOpen){cursor=(cursor-1+channels.length)%channels.length;updateFocus()} else changeChannel(cur-1);
      e.preventDefault(); break;
    case 'ArrowDown': case 'PageDown':
      if(menuOpen){cursor=(cursor+1)%channels.length;updateFocus()} else changeChannel(cur+1);
      e.preventDefault(); break;
    case 'Enter':
      if(menuOpen){changeChannel(cursor);toggleMenu(false)} else toggleMenu(true);
      e.preventDefault(); break;
    case 'Back': case 'Escape': case 'Backspace':
      if(menuOpen){toggleMenu(false);e.preventDefault()} break;
    case 'm': case 'M': toggleMute(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'ArrowLeft': video.volume=Math.max(0,video.volume-.1); break;
    case 'ArrowRight': video.volume=Math.min(1,video.volume+.1); break;
    default:
      if(e.key>='0'&&e.key<='9') numberInput(e.key);
  }
});

// மவுஸ் / டச்
startScr.addEventListener('click',startPlayback);
$('btn-menu').onclick=()=>toggleMenu();
$('btn-close').onclick=()=>toggleMenu(false);
$('btn-prev').onclick=()=>changeChannel(cur-1);
$('btn-next').onclick=()=>changeChannel(cur+1);
$('btn-mute').onclick=toggleMute;
$('btn-fs').onclick=toggleFullscreen;
$('video-container').addEventListener('click',()=>{ if(menuOpen) toggleMenu(false); else {showBanner();wakeControls()} });
$('video-container').addEventListener('dblclick',toggleFullscreen);
document.addEventListener('mousemove',()=>{if(started)wakeControls()});
document.addEventListener('touchstart',()=>{if(started)wakeControls()},{passive:true});

buildList();
</script>
</body>
</html>
